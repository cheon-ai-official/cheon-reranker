name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (transformers ${{ matrix.transformers }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        transformers: ["4.57.*", "5.*"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache the model and the dataset
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-cheon-reranker-0.6b-v1
      - name: Install (CPU build of PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" "transformers==${{ matrix.transformers }}"
      - name: Tests
        run: pytest -v
      - name: Cookbook
        run: |
          python cookbook/00_quickstart/rerank_candidates.py
          python cookbook/00_quickstart/two_stage_retrieval.py
